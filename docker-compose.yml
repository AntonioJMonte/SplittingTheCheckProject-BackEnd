services:
  postgres:
    image: postgres:16-alpine
    # Só na máquina local: o banco de dev não fica exposto para a rede.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: splittr
      POSTGRES_PASSWORD: splittr
      POSTGRES_DB: splittr_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U splittr']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Major fixa (a 8, que já estava em uso): `redis:alpine` muda de major sem aviso. Sem volume e sem snapshot
    # (`--save ''`): é só cache, e um dump gravado por uma versão não precisa abrir em outra.
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save ''
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # D-106: a própria imagem aplica as migrations ao iniciar, como faria numa plataforma de um contêiner só.
  app:
    build:
      context: .
      target: runtime
    ports:
      - '3333:3333'
    # Hosts são os nomes dos serviços, nunca localhost. Segredos vêm do .env da raiz quando
    # existir; os padrões abaixo servem só para subir localmente a partir de um clone limpo.
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://splittr:splittr@postgres:5432/splittr_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-troque-em-producao}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-troque-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
